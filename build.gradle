plugins {
	id 'java'
	id 'application'
}

application {
	mainClass = 'ch.bbw.m450.tictactoe.TicTacToeMain'
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.1'
    testImplementation 'org.assertj:assertj-core:3.27.7'
}

run {
	standardInput = System.in
}

repositories {
	mavenCentral()
}

test {
	useJUnitPlatform()
}
